server:
  port: 8081

spring:
  application:
    name: chatbot-whatsapp

  datasource:
    url: jdbc:postgresql://localhost:5432/chatbot
    username: chatbot
    password: chatbot123
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  data:
    redis:
      host: localhost
      port: 6379

  flyway:
    enabled: true
    locations: classpath:db/migration

groq:
  base-url: https://api.groq.com
  api-key: ${GROQ_API_KEY}

evolution:
  base-url: ${EVOLUTION_BASE_URL:http://localhost:8080}
  instance: ${EVOLUTION_INSTANCE:chatbot}
  api-key: ${EVOLUTION_API_KEY}

bot:
  trigger-words: tung, cajado, sahur
  random-response-chance: 15

springdoc:
  swagger-ui:
    path: /swagger-ui.html